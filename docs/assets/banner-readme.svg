<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#10121a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ef1d2"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(94,241,210,0.06)" stroke-width="1"/>
    </pattern>
    <radialGradient id="spot1" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="rgba(94,241,210,0.12)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="spot2" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="rgba(168,85,247,0.10)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)"/>
  <rect width="800" height="200" fill="url(#grid)"/>
  <rect width="800" height="200" fill="url(#spot1)"/>
  <rect width="800" height="200" fill="url(#spot2)"/>

  <!-- Glyph mark -->
  <g filter="url(#glow)" transform="translate(56,100)">
    <rect x="-30" y="-30" width="60" height="60" rx="6" fill="rgba(94,241,210,0.08)" stroke="rgba(94,241,210,0.5)" stroke-width="1.5"/>
    <text x="0" y="12" font-family="'Fira Code', 'Courier New', monospace" font-size="36" font-weight="700" fill="#5ef1d2" text-anchor="middle">⊞</text>
  </g>

  <!-- Title -->
  <text x="140" y="95" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#e2e8f0" letter-spacing="1">Uiua Resonance Lab</text>

  <!-- Subtitle -->
  <text x="140" y="126" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8" letter-spacing="1.5">
    Tacit Array · Point-Free Polyphony · v0.14
  </text>

  <!-- Tagline -->
  <text x="140" y="158" font-family="'Fira Code', 'Courier New', monospace" font-size="12" fill="#5ef1d2" letter-spacing="2">
    ⊞ ○ ∿ ⇡ ⇌ ∺ τ ▽ ⌕
  </text>

  <!-- Accent line -->
  <line x1="140" y1="175" x2="740" y2="175" stroke="url(#accent)" stroke-width="1" opacity="0.4"/>

  <!-- Badges -->
  <g font-family="'Fira Code', monospace" font-size="10">
    <rect x="140" y="182" width="80" height="14" rx="3" fill="rgba(94,241,210,0.08)" stroke="rgba(94,241,210,0.3)"/>
    <text x="180" y="192" fill="#5ef1d2" text-anchor="middle">ZERO BUILD</text>

    <rect x="230" y="182" width="100" height="14" rx="3" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.3)"/>
    <text x="280" y="192" fill="#c084fc" text-anchor="middle">ZERO DEPS</text>

    <rect x="340" y="182" width="100" height="14" rx="3" fill="rgba(236,72,153,0.08)" stroke="rgba(236,72,153,0.3)"/>
    <text x="390" y="192" fill="#f472b6" text-anchor="middle">WEB AUDIO</text>

    <rect x="450" y="182" width="100" height="14" rx="3" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.3)"/>
    <text x="500" y="192" fill="#fbbf24" text-anchor="middle">CANVAS 2D</text>

    <rect x="560" y="182" width="60" height="14" rx="3" fill="rgba(16,18,26,0.8)" stroke="rgba(148,163,184,0.2)"/>
    <text x="590" y="192" fill="#94a3b8" text-anchor="middle">MIT</text>
  </g>
</svg>
